[project]
name = "speech-quant"
version = "0.1.0"
description = "Effect of quantization on autoregressive neural-codec speech models"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
# ============================================================
# Base dependencies: shared across all models
# ============================================================
base = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "accelerate>=0.30",
    "soundfile>=0.12",
    "librosa>=0.10.0",  # acoustic metrics (MCD, F0)
    "utmosv2>=1.0.0",  # acoustic metrics (UTMOS MOS prediction)
    "matplotlib>=3.7",
    "pandas>=2.0",
    "openpyxl>=3.1",  # consolidated analysis_report.xlsx
    "nemo_text_processing>=1.0",  # WER/CER text normalization
]

# ============================================================
# Model-specific groups: use `uv sync --group <model-name>`
# ============================================================

# Orpheus: canopylabs/orpheus with SNAC codec
orpheus = [
    {include-group = "base"},
    "numpy>=1.26",
    "transformers>=5.15.0",
    "datasets>=4.8.4,<=4.8.5",
    "huggingface-hub>=1.5.0",
    "pyarrow>=21.0.0",
    "snac>=1.2.1",
    "utmosv2 @ git+https://github.com/sarulab-speech/UTMOSv2.git",
    # Not in `base`: gptqmodel>=7 requires torchao>=0.16, which neutts cannot take.
    "gptqmodel>=7.0.0",
    "optimum==2.2.0",
    "llmcompressor @ git+https://github.com/vllm-project/llm-compressor.git",
]

# NeuTTS: neuphonic/neutts with NeuCodec
neutts = [
    {include-group = "base"},
    "numpy>=2.0.2",  # neucodec requires numpy 2.x
    "transformers>=5.15.0",
    "datasets>=4.8.4,<=4.8.5",
    "huggingface-hub>=1.5.0",
    "pyarrow>=21.0.0",
    "neucodec>=0.0.6",
    "utmosv2 @ git+https://github.com/sarulab-speech/UTMOSv2.git",
    "torchao==0.13.0",
    "torchtune==0.5.0",
    "vector-quantize-pytorch==1.17.8",
    "llmcompressor @ git+https://github.com/vllm-project/llm-compressor.git",
]

# OuteTTS: with Descript Audio Codec
outetts = [
    {include-group = "base"},
    "numpy>=1.26",
    "transformers>=5.15.0",
    "datasets>=4.8.4,<=4.8.5",
    "huggingface-hub>=1.5.0",
    "pyarrow>=21.0.0",
    "descript-audio-codec>=1.0",
    "utmosv2 @ git+https://github.com/sarulab-speech/UTMOSv2.git",
    "llmcompressor @ git+https://github.com/vllm-project/llm-compressor.git",
]

# ASR: Transcription (WER/CER) over already-generated audio (src/evaluate_transcription.py).
# Standalone on purpose -- it does not include `base`, so it needs no quantization
# stack and stays resolvable independently. Install with `uv pip install --group asr`
# (not `uv sync`, which would resolve every other group too).
asr = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "accelerate>=0.30",
    "transformers>=5.15.0",
    "huggingface-hub>=1.5.0",
    "sentencepiece>=0.2",  # CohereAsr tokenizer
    "protobuf>=4.25",
    "soundfile>=0.12",
    "librosa>=0.10.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "nemo_text_processing>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = false
default-groups = []  # Don't automatically include any groups
environments = ["sys_platform == 'linux' and python_version == '3.12'"]
conflicts = [
    # Every group below is installed into its own venv (.venv-<name>), and they are
    # pairwise unsatisfiable together: neutts pins torchao==0.13 for neucodec,
    # outetts pulls descript-audio-codec (protobuf<3.20), orpheus pulls
    # gptqmodel>=7 (torchao>=0.16, protobuf>=7.34), and asr needs transformers>=5.15
    # with protobuf>=4.25. Declaring the pairs keeps `uv lock` from trying to
    # satisfy all of them in one resolution.
    [{ group = "orpheus" }, { group = "neutts" }],
    [{ group = "orpheus" }, { group = "outetts" }],
    [{ group = "orpheus" }, { group = "asr" }],
    [{ group = "neutts" }, { group = "outetts" }],
    [{ group = "neutts" }, { group = "asr" }],
    [{ group = "outetts" }, { group = "asr" }],
    # base is included by the TTS groups, but not by the standalone asr group.
    [{ group = "base" }, { group = "asr" }],
]
