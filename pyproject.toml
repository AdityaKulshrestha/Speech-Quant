[project]
name = "speech-quant"
version = "0.1.0"
description = "Effect of quantization on autoregressive neural-codec speech models"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "accelerate>=0.30",
    "snac>=1.2.1",
    "soundfile>=0.12",
    "numpy>=1.26",
    "gptqmodel>=7.0",
    "datasets>=2.0",
    "matplotlib>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = false
