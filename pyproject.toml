[project]
name = "speech-quant"
version = "0.1.0"
description = "Effect of quantization on autoregressive neural-codec speech models"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
# ============================================================
# Base dependencies: shared across all models
# ============================================================
base = [
    "torch==2.11.0+xpu",
    "torchaudio==0.26.0+xpu", #2.13 works
    "torchaudio==2.11.0+xpu",
    "accelerate>=0.30",
    "soundfile>=0.12",
    "librosa>=0.10.0",  # acoustic metrics (MCD, F0)
    "speechmos>=0.0.1",  # perceptual quality (UTMOS)
    # numpy version specified per-model due to llmcompressor/neucodec conflicts
    "matplotlib>=3.7",
    "pandas>=2.0",
    "gptqmode>=7.0.0",
    "optimum==2.2.0",
    "openpyxl>=3.1",  # consolidated analysis_report.xlsx
    "nemo_text_processing>=1.0",  # WER/CER text normalization
]

# ============================================================
# Model-specific groups: use `uv sync --group <model-name>`
# ============================================================

# Orpheus: canopylabs/orpheus with SNAC codec
orpheus = [
    {include-group = "base"},
    "numpy>=1.26",
    "transformers>=5.15.0",
    "datasets>=4.8.4,<=4.8.5",
    "huggingface-hub>=1.5.0",
    "pyarrow>=21.0.0",
    "snac>=1.2.1",
    "llmcompressor @ git+https://github.com/vllm-project/llm-compressor.git",
]

# NeuTTS: neuphonic/neutts with NeuCodec
neutts = [
    {include-group = "base"},
    "numpy>=2.0.2",  # neucodec requires numpy 2.x
    "transformers>=5.15.0",
    "datasets>=4.8.4,<=4.8.5",
    "huggingface-hub>=1.5.0",
    "pyarrow>=21.0.0",
    "neucodec>=0.0.6",
    "torchao==0.13.0",
    "torchtune==0.5.0",
    "vector-quantize-pytorch==1.17.8",
    "llmcompressor @ git+https://github.com/vllm-project/llm-compressor.git",
]

# Qwen TTS: uses llmcompressor 0.9.x (requires torch<=2.9.1, transformers 4.57.3, numpy>=2.0)
# Standalone group with different torch version
qwen-tts = [
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "accelerate>=0.30",
    "soundfile>=0.12",
    "numpy>=2.0.0,<=2.3.5",  # llmcompressor 0.9.x requirement
    "librosa>=0.10.0",  # acoustic metrics (MCD, F0)
    "speechmos>=0.0.1",  # perceptual quality (UTMOS)
    "matplotlib>=3.7",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "nemo_text_processing>=1.0",
    "transformers==4.57.3",
    "datasets>=4.0.0,<=4.4.1",  # llmcompressor 0.9.x requirement
    "huggingface-hub>=0.36.0,<1.0.0",
    "pyarrow<21",
    "qwen_tts @ git+https://github.com/QwenLM/Qwen3-TTS",
    "llmcompressor>=0.9.0,<0.10.0",
]

# OuteTTS: with Descript Audio Codec
outetts = [
    {include-group = "base"},
    "numpy>=1.26",
    "transformers>=5.15.0",
    "datasets>=4.8.4,<=4.8.5",
    "huggingface-hub>=1.5.0",
    "pyarrow>=21.0.0",
    "descript-audio-codec>=1.0",
    "llmcompressor @ git+https://github.com/vllm-project/llm-compressor.git",
]

# LLASA: Temporarily disabled due to incompatible torch version (2.4.1 vs 2.11.0)
# TODO: Re-enable after resolving torch version conflicts
# llasa = [
#     "torch==2.4.1",
#     "torchaudio==2.4.1",
#     "accelerate>=0.30",
#     "soundfile>=0.12",
#     "numpy==2.0.2",
#     "matplotlib>=3.7",
#     "pandas>=2.0",
#     "openpyxl>=3.1",
#     "nemo_text_processing>=1.0",
#     "transformers==4.45.2",
#     "xcodec2==0.1.3",
#     "gptqmodel>=1.0.0",
# ]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/xpu"

[tool.uv]
package = false
default-groups = []  # Don't automatically include any groups
environments = ["sys_platform == 'linux' and python_version == '3.12'"]
conflicts = [
    # qwen-tts (torch 2.9.1, transformers 4.57.3) vs others (torch 2.11.0, transformers 5.15+)
    [
        { group = "qwen-tts" },
        { group = "orpheus" },
    ],
    [
        { group = "qwen-tts" },
        { group = "neutts" },
    ],
    [
        { group = "qwen-tts" },
        { group = "outetts" },
    ],
    # base conflicts with qwen-tts
    [
        { group = "base" },
        { group = "qwen-tts" },
    ],
]
